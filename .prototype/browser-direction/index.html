<body>
<div class="lab-top"><span><i class="lab-dot" aria-hidden="true"></i> Iteration 02 · simulated data</span><div class="lab-actions"><button class="lab-button" id="guide-toggle" type="button">Style guide</button><button class="lab-button" id="design-toggle" type="button" aria-expanded="false" aria-controls="design-panel">Design controls</button></div></div>
<div class="preview-stage">
 <div class="staf" id="staf" data-theme="light" data-layout="a" data-palette="green" data-type="editorial"><div id="app" class="app-shell"></div><div id="modal-root"></div></div>
 <aside class="design-panel" id="design-panel" aria-label="Prototype design controls" hidden></aside>
 <div class="lab-toast" role="status" id="toast" hidden></div>
</div>
<p class="lab-state" id="lab-state"></p>
<p class="lab-footer">Use the header toggle for Focus mode. Choose a provider or model directly from the composer menu. Demo changes reset on reload.</p>
<script>
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shapes=[[[58,18],[82,18],[50,50],[18,82],[42,82]],[[50,14],[84.24,38.88],[71.16,79.12],[28.84,79.12],[15.76,38.88]],[[26,26],[74,26],[50,50],[26,74],[74,74]],[[14,74],[32,47],[50,20],[68,47],[86,74]],[[20,24],[20,76],[50,24],[50,76],[80,50]]];
const logoNames=['Relay','Orbit','Gather','Lift','Signal'];
const iconPaths={panel:'M3 4h18v16H3ZM9 4v16',plus:'M12 5v14M5 12h14',send:'M12 19V5m-6 6 6-6 6 6',stop:'M7 7h10v10H7Z',gear:'M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1 1-3ZM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',close:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4L19 6',copy:'M9 9h11v12H9ZM4 16H2V2h12v2',chevron:'m9 6 6 6-6 6',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM12 6v6l4 2',down:'m6 9 6 6 6-6'};
function icon(name,size=16){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${iconPaths[name]}"/></svg>`;}
function logo(index=state.design.logo){return `<svg viewBox="0 0 100 100" aria-hidden="true">${shapes[index].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${index===1||index===2?11:10}" fill="currentColor"/>`).join('')}</svg>`;}
const designs={variant:'a',palette:'green',appearance:'light',type:'editorial',body:14,space:20,corner:12,logo:1};
let query;try{query=new URLSearchParams(location.search)}catch{query=new URLSearchParams()}
if(['a','c'].includes(query.get('variant')))designs.variant=query.get('variant');
else if(matchMedia('(max-width:590px)').matches)designs.variant='c';
const initialMessage=[{role:'user',text:'Turn these notes into a launch brief. Flag anything we still need to confirm.'},{role:'assistant',text:'I turned the notes into a first pass. Two details still need your call.',draft:true}];
const state={design:{...designs},view:'chat',selected:'mara',scenario:'conversation',modal:null,modelMenu:false,controls:false,agents:[{id:'mara',name:'Mara',detail:'Writing & clarity',instructions:'Help me write clearly. Be thoughtful, concise, and honest about what is still uncertain.',provider:'Codex',model:'Example model',draft:'',messages:structuredClone(initialMessage),approval:null,response:null},{id:'atlas',name:'Atlas',detail:'Research & context',instructions:'Help me investigate questions and keep sources and uncertainty clear.',provider:'Codex',model:'Example model',draft:'',messages:[{role:'assistant',text:'What would you like to look into? We can start with a question or work through the context together.'}],approval:null,response:null},{id:'scout',name:'Scout',detail:'Everyday assistance',instructions:'Help with practical everyday tasks. Keep things simple.',provider:'OpenRouter',model:'Example model',draft:'',messages:[],approval:null,response:null}],nextId:1};
const current=()=>state.agents.find(a=>a.id===state.selected);
let toastTimer;const timers=new Map();let responseCounter=0;
const media=matchMedia('(prefers-color-scheme:dark)');
function notify(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200)}
function effectiveTheme(){return state.design.appearance==='system'?(media.matches?'dark':'light'):state.design.appearance}
function syncDesign(){const d=state.design,root=$('#staf');root.dataset.layout=d.variant;root.dataset.theme=effectiveTheme();root.dataset.palette=d.palette;root.dataset.type=d.type;root.style.setProperty('--body-size',d.body+'px');root.style.setProperty('--space',d.space+'px');root.style.setProperty('--corner',d.corner+'px');const toggle=$('.sidebar-toggle');if(toggle){const expanded=d.variant!=='c';toggle.setAttribute('aria-expanded',String(expanded));toggle.setAttribute('aria-label',expanded?'Collapse sidebar into Focus':'Expand sidebar');toggle.title=expanded?'Collapse sidebar into Focus':'Expand sidebar';}$('#lab-state').textContent=`Sidebar ${d.variant==='c'?'collapsed / Focus':'expanded'} · ${d.palette==='green'?'Evergreen':d.palette==='ink'?'Ink':'Clay'} · ${d.appearance} · ${d.type} · ${d.body}px text · ${d.space}px spacing · ${logoNames[d.logo]} mark`;const config=$('#config-summary');if(config)config.textContent=summary();}
function summary(){const d=state.design;return `Sidebar: ${d.variant==='c'?'collapsed / Focus':'expanded'}
Palette: ${d.palette}
Appearance: ${d.appearance}
Type: ${d.type}
Body: ${d.body}px
Spacing: ${d.space}px
Corners: ${d.corner}px
Logo: ${logoNames[d.logo]}`;}
function setVariant(v){if(!['a','c'].includes(v))return;state.design.variant=v;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u)}catch{}syncDesign();}
function setView(view){state.view=view;state.modal=null;state.modelMenu=false;render();}
function switchAgent(id){state.selected=id;state.view='chat';state.scenario='conversation';state.modal=null;state.modelMenu=false;render();}
function sidebar(){return `<aside class="sidebar" id="agent-sidebar"><button class="brand" data-action="chat" aria-label="Staf, return to chat">${logo()}<span>staf</span></button><div class="side-caption" id="agents-heading">Your agents</div><button class="new-agent" data-action="new" title="New agent" aria-label="Create a new agent">${icon('plus')}<span>New agent</span></button><nav class="agent-list" aria-label="Agents">${state.agents.map(a=>`<button class="agent-nav ${a.id===state.selected&&state.view==='chat'?'active':''}" data-agent="${a.id}" ${a.id===state.selected&&state.view==='chat'?'aria-current="page"':''} title="${esc(a.name)}"><span class="avatar">${esc(a.name[0].toUpperCase())}</span><span class="identity"><strong>${esc(a.name)}</strong><small>${esc(a.detail)}</small></span></button>`).join('')}</nav><div class="side-bottom"><button class="settings-nav ${state.view==='settings'?'active':''}" data-action="settings" title="Settings" ${state.view==='settings'?'aria-current="page"':''}>${icon('gear')}<span>Settings</span></button><div class="workspace-caption">Personal workspace</div></div></aside>`;}
function header(){const a=current(),title=state.view==='settings'?'Settings':state.view==='guide'?'Style guide':a.name;return `<header class="app-header"><button class="icon-button sidebar-toggle" data-action="toggle-sidebar" aria-controls="agent-sidebar" aria-expanded="${state.design.variant!=='c'}" aria-label="${state.design.variant==='c'?'Expand sidebar':'Collapse sidebar into Focus'}">${icon('panel')}</button><button class="avatar header-avatar" data-action="agent-settings" title="Agent settings" aria-label="Open ${esc(a.name)} settings">${esc(a.name[0].toUpperCase())}</button><div class="header-identity"><strong>${esc(title)}</strong><small>${state.view==='chat'?'Your ongoing conversation':state.view==='agent'?'Agent settings':state.view==='settings'?'Make this space your own.':'Quiet work · foundations'}</small></div><div class="header-actions">${state.view==='chat'?`<button class="icon-button" data-action="approval-sample" title="Try an inline approval" aria-label="Try a simulated clock approval">${icon('clock')}</button>`:''}<button class="icon-button" data-action="${state.view==='chat'?'agent-settings':'chat'}" aria-label="${state.view==='chat'?'Agent settings':'Back to chat'}" title="${state.view==='chat'?'Agent settings':'Back to chat'}">${icon(state.view==='chat'?'gear':'close')}</button></div></header>`;}
function message(m,a){if(m.role==='user')return `<article class="message user"><div class="who">You</div><p>${esc(m.text).replaceAll('\n','<br>')}</p></article>`;return `<article class="message assistant"><div class="author"><span class="avatar">${esc(a.name[0].toUpperCase())}</span>${esc(a.name)}<time>9:42 AM</time></div>${m.draft?'<h2 class="editorial">A clearer story, ready to shape.</h2>':''}<p>${esc(m.text).replaceAll('\n','<br>')}</p>${m.draft?`<section class="draft-card"><div class="draft-meta">Launch brief <span class="badge">Draft</span></div><h3>A calmer start to every day.</h3><p>Bring the day’s scattered tasks into one clear place, with room to move forward.</p><div class="uncertain">Still to confirm: launch date and final pricing.</div><div class="inline-actions"><button class="text-action" data-action="copy-draft">${icon('copy',12)}Copy draft</button></div></section>`:''}${m.stopped?'<small class="tool-result">Response stopped</small>':''}</article>`;}
function approval(a){if(!a.approval)return '';const p=a.approval;if(p.status==='pending')return `<section class="inline-tool" aria-label="Clock approval request"><span class="tool-label">${icon('clock',12)} Clock request</span><h3>Allow one clock read?</h3><p>${esc(a.name)} wants the current UTC time for this message.</p><code class="tool-code">clock.current_time · UTC</code><div class="button-row"><button class="primary-button" data-action="approve">Approve once</button><button class="secondary-button" data-action="deny">Deny</button></div></section>`;return `<details class="inline-tool"><summary class="tool-result">${p.status==='approved'?'✓ Clock read succeeded':'Clock read denied'}</summary><code class="tool-code">clock.current_time · UTC</code><p class="tool-result">${p.status==='approved'?'Example result: 14:32:08 UTC. This is sample data.':'The request was denied. No clock read was made.'}</p></details>`;}
function chat(){const a=current();return `<section class="chat-layout" aria-label="Conversation with ${esc(a.name)}"><div class="messages" id="messages" data-agent="${a.id}">${a.messages.length?'<div class="date">Today / Your main chat</div>':`<div class="empty-state"><div class="logo-large">${logo()}</div><h2>Say hello to ${esc(a.name)}.</h2><p>A little space for whatever comes next.</p></div>`}${a.messages.map(m=>message(m,a)).join('')}${approval(a)}${a.response?`<article class="message assistant streaming"><div class="author"><span class="avatar">${esc(a.name[0].toUpperCase())}</span>${esc(a.name)}<span class="badge">Writing</span></div><p id="stream-text">${esc(a.response.text)||'…'}</p></article>`:''}</div><div class="composer-area"><div class="composer"><textarea id="message-input" rows="2" aria-label="Message ${esc(a.name)}" placeholder="Message ${esc(a.name)}…">${esc(a.draft)}</textarea><div class="composer-controls"><div class="model-control"><button class="model-button" data-action="model-picker" aria-label="Choose provider and model" aria-haspopup="menu" aria-controls="model-menu" aria-expanded="${state.modelMenu}"><span class="provider-name">${esc(a.provider)}</span><span> / </span><span class="model-name">${esc(a.model)}</span>${icon('down',11)}</button><div class="model-menu" id="model-menu" role="menu" aria-label="Provider and model" hidden></div></div><button class="send-button" data-action="${a.response?'stop':'send'}" aria-label="${a.response?'Stop response':'Send message'}" title="${a.response?'Stop response':'Send (Enter)'}" ${!a.response&&!a.draft.trim()?'disabled':''}>${icon(a.response?'stop':'send')}</button></div></div><p class="composer-hint">Enter to send · Shift + Enter for a new line</p></div></section>`;}
function themeCards(){return `<div class="theme-grid">${['light','dark','system'].map(value=>`<button class="theme-card" type="button" data-appearance="${value}" aria-pressed="${state.design.appearance===value}"><div class="mini ${value}"><div class="mini-rail"></div><div class="mini-main"><div class="mini-input"></div></div></div><span class="theme-name">${value[0].toUpperCase()+value.slice(1)}<i class="choice-dot" aria-hidden="true"></i></span></button>`).join('')}</div>`;}
function settings(){return `<div class="scroll-pane"><div class="settings-content"><p class="eyebrow">Your workspace</p><h1 class="page-title">A space that feels like yours.</h1><p class="page-intro">Personal appearance. Shared connections. Individual agents.</p><section class="settings-section"><h2 class="section-title">Appearance</h2><p class="section-help">Choose how Staf looks in this browser.</p>${themeCards()}</section><section class="settings-section"><h2 class="section-title">Provider connections</h2><p class="section-help">Connections belong to this Staf instance and are available to all your agents.</p><div class="providers"><div class="provider-card"><div class="provider-title"><h3>Codex</h3><span class="badge">Sign-in saved</span></div><p>Saved sign-in has not been checked against the provider.</p><button class="secondary-button" data-action="connection-preview">Sign in again</button></div><div class="provider-card"><div class="provider-title"><h3>OpenRouter</h3><span class="badge">No key saved</span></div><p>Add an API key to make OpenRouter available to your agents.</p><button class="secondary-button" data-action="connection-preview">Add API key</button></div></div></section><section class="setting-card"><h2 class="section-title">Creation defaults</h2><p>Copied into new agents. Existing agents keep their own settings.</p><button class="text-action" data-action="defaults-preview">Edit defaults ${icon('chevron',11)}</button></section><p class="section-help" style="margin-top:18px">Each agent keeps its own provider, model, and instructions.</p></div></div>`;}
function agentSettings(){const a=current();return `<div class="scroll-pane"><form class="settings-content" id="profile-form"><p class="eyebrow">Agent settings</p><h1 class="page-title">A little more ${esc(a.name)}.</h1><p class="page-intro">A name, a point of view, and the right tools for the work.</p><label class="field">Name<input name="name" required maxlength="40" value="${esc(a.name)}"></label><label class="field">Instructions<textarea name="instructions" rows="4">${esc(a.instructions)}</textarea><span class="field-note">Standing guidance for the agent’s personality, role, and behavior.</span></label><div class="form-row"><label class="field">Provider<select name="provider"><option ${a.provider==='Codex'?'selected':''}>Codex</option><option ${a.provider==='OpenRouter'?'selected':''}>OpenRouter</option></select></label><label class="field">Model<select name="model"><option>Example model</option><option ${a.model==='Another example model'?'selected':''}>Another example model</option></select></label></div><p class="field-note">Provider connections are shared across the instance. This choice belongs to ${esc(a.name)}.</p><div class="save-row"><button class="primary-button" type="submit">Save settings</button><button class="text-action" type="button" data-action="chat">Cancel</button></div></form></div>`;}
function guide(){const d=state.design;return `<div class="scroll-pane"><div class="settings-content"><p class="eyebrow">Staf / Quiet work / Style guide</p><h1 class="page-title">A little warmth.<br>A lot of clarity.</h1><p class="page-intro">Live foundations for the design study. Adjust a control to see these roles change across every screen.</p><section class="settings-section"><h2 class="section-title">Color with a job to do.</h2><p class="section-help">Action, attention, and a quiet place to read.</p><div class="guide-grid">${[['Paper','--paper'],['Surface','--surface'],['Action','--action'],['Soft accent','--soft'],['Evergreen rail','--rail'],['Attention','--warn-bg']].map(([label,key])=>`<div><div class="swatch" style="background:var(${key})"></div><div class="swatch-label">${label}</div></div>`).join('')}</div></section><div class="type-sample"><small>${d.type==='editorial'?'Instrument Serif':'DM Sans'} / Headings</small><h2 class="editorial">Room for better work.</h2></div><div class="type-sample"><small>DM Sans / Conversation</small><p>Thoughtful words, readable at every scale. Give the work room to breathe.</p><div class="button-row"><button class="primary-button" data-action="sample-action">Primary action</button><button class="secondary-button" data-action="sample-action">Secondary action</button></div></div><section class="settings-section"><h2 class="section-title">Five dots. Five directions.</h2><p class="section-help">Choose a mark to try it in the workspace.</p><div class="guide-logos">${logoNames.map((name,i)=>`<button data-logo="${i}" aria-label="Use ${name} logo" aria-pressed="${d.logo===i}" title="${name}">${logo(i)}</button>`).join('')}</div></section></div></div>`;}
function render(){const a=current(),messageList=$('#messages');if(messageList&&messageList.dataset.agent===a.id&&a.scroll!==1e9)a.scroll=messageList.scrollTop;$('#app').innerHTML=sidebar()+`<main class="main-pane">${header()}<div class="app-content">${state.view==='chat'?chat():state.view==='settings'?settings():state.view==='agent'?agentSettings():guide()}</div></main>`;$('#guide-toggle').textContent=state.view==='guide'?'Back to app':'Style guide';$('#guide-toggle').setAttribute('aria-pressed',String(state.view==='guide'));syncDesign();renderModelMenu();renderModal();if(state.view==='chat'){const list=$('#messages');list.scrollTop=a.scroll??list.scrollHeight;a.scroll=list.scrollTop;}}
function renderModal(){const root=$('#modal-root');if(!state.modal){root.innerHTML='';return}root.innerHTML=`<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">Meet your next agent.</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><form id="new-agent-form"><p>Start with a name. A little standing guidance helps them find their voice.</p><label class="field">Name<input name="name" placeholder="e.g. Robin" required maxlength="40"></label><label class="field">Instructions <span class="field-note">Optional</span><textarea name="instructions" rows="3" placeholder="What should they help you with?"></textarea></label><p class="field-note">Creation defaults are copied into this agent.</p><div class="modal-footer"><button class="secondary-button" type="button" data-action="close-modal">Cancel</button><button class="primary-button">Create agent</button></div></form></section></div>`;setTimeout(()=>root.querySelector('input')?.focus(),0);}

function renderModelMenu(){const menu=$('#model-menu'),trigger=$('.model-button');if(!menu)return;const a=current();menu.hidden=!state.modelMenu;trigger.setAttribute('aria-expanded',String(state.modelMenu));if(!state.modelMenu){menu.innerHTML='';return}menu.innerHTML=`<div class="model-menu-group" role="group" aria-label="Provider"><div class="menu-caption">Provider</div>${['Codex','OpenRouter'].map(p=>`<button class="model-option" type="button" role="menuitemradio" aria-checked="${a.provider===p}" tabindex="-1" data-picker-provider="${p}"><span>${p}</span>${a.provider===p?icon('check',13):''}</button>`).join('')}</div><div class="model-menu-group" role="group" aria-label="Model"><div class="menu-caption">Model</div>${['Example model','Another example model'].map(m=>`<button class="model-option" type="button" role="menuitemradio" aria-checked="${a.model===m}" tabindex="-1" data-picker-model="${m}"><span>${m}</span>${a.model===m?icon('check',13):''}</button>`).join('')}</div><div class="menu-note">Sample models for this design study.</div>`;}
function openModelMenu(edge='selected'){state.modelMenu=true;renderModelMenu();const items=[...$('#model-menu').querySelectorAll('[role=menuitemradio]')];const selected=items.find(n=>n.dataset.pickerModel===current().model);(edge==='first'?items[0]:edge==='last'?items.at(-1):selected||items[0])?.focus();}
function closeModelMenu(restoreFocus=false){if(!state.modelMenu)return;state.modelMenu=false;renderModelMenu();if(restoreFocus)$('.model-button')?.focus();}

function renderControls(){const d=state.design;$('#design-panel').innerHTML=`<header><h2>Design controls</h2><button class="lab-button" data-action="close-controls" aria-label="Close design controls">${icon('close',14)}</button></header><p>Try a direction, then tell me what works. Changes apply to all screens in this prototype.</p><label class="lab-field">Palette<select data-design="palette">${[['green','Evergreen & paper'],['ink','Ink & paper'],['clay','Clay & paper']].map(([v,n])=>`<option value="${v}" ${d.palette===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="lab-field">Appearance<select data-design="appearance">${['light','dark','system'].map(v=>`<option value="${v}" ${d.appearance===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></label><label class="lab-field">Typography<select data-design="type"><option value="editorial" ${d.type==='editorial'?'selected':''}>Editorial / serif headings</option><option value="sans" ${d.type==='sans'?'selected':''}>Sans / all DM Sans</option></select></label>${[['body','Conversation text',13,17],['space','Breathing room',14,32],['corner','Corner radius',0,22]].map(([key,name,min,max])=>`<label class="lab-field">${name}<output id="output-${key}">${d[key]}px</output><input type="range" min="${min}" max="${max}" value="${d[key]}" data-design="${key}" aria-label="${name}"></label>`).join('')}<div class="lab-field">Five-dot mark<div class="logo-controls">${logoNames.map((name,i)=>`<button type="button" data-logo="${i}" aria-label="Use ${name} logo" aria-pressed="${d.logo===i}" title="${name}">${logo(i)}</button>`).join('')}</div></div><pre class="config-summary" id="config-summary">${esc(summary())}</pre><button class="lab-button" data-action="reset-design">Reset design</button>`;$('#design-panel').hidden=!state.controls;$('#design-toggle').setAttribute('aria-expanded',String(state.controls));}
function send(){const a=current();if(a.response||!a.draft.trim())return;const value=a.draft.trim();a.messages.push({role:'user',text:value});a.draft='';a.scroll=1e9;if(/\b(time|clock|utc)\b/i.test(value)){a.approval={status:'pending'};render();return}const full='This is a simulated response so you can try the conversation. The layout, spacing, and reading rhythm are the things to judge here. Tell me what you would like to change.';a.response={id:++responseCounter,text:'',full};const id=a.response.id;render();const tick=setInterval(()=>{if(!a.response||a.response.id!==id){clearInterval(tick);return}a.response.text=full.slice(0,a.response.text.length+4);if(a.id===state.selected&&state.view==='chat'){const t=$('#stream-text');if(t)t.textContent=a.response.text;const list=$('#messages');if(list&&list.scrollHeight-list.scrollTop-list.clientHeight<85)list.scrollTop=list.scrollHeight;}if(a.response.text===full){a.messages.push({role:'assistant',text:full});a.response=null;timers.delete(a.id);clearInterval(tick);if(a.id===state.selected)render();}},55);timers.set(a.id,tick);}
function stop(){const a=current();if(!a.response)return;clearInterval(timers.get(a.id));timers.delete(a.id);a.messages.push({role:'assistant',text:a.response.text||'The response was stopped before text arrived.',stopped:true});a.response=null;render();notify('Example response stopped. Your next draft is retained.');}
function sampleApproval(){const a=current();if(a.response)stop();a.approval={status:'pending'};if(!a.messages.some(m=>m.role==='user'&&m.text==='What time is it in UTC?'))a.messages.push({role:'user',text:'What time is it in UTC?'});state.view='chat';a.scroll=1e9;render();}
function decide(status){const a=current();if(a.approval?.status!=='pending')return;a.approval.status=status;a.messages.push({role:'assistant',text:status==='approved'?'The example time is 14:32:08 UTC. This clock result is simulated.':'I left the clock request unexecuted.'});a.scroll=1e9;render();}
function showControls(open){state.controls=open;renderControls();if(open)$('#design-panel').querySelector('select')?.focus();else $('#design-toggle').focus();}
function setDesign(key,value){if(['body','space','corner'].includes(key))value=Number(value);if(key==='variant'){setVariant(value);return}state.design[key]=value;syncDesign();const out=$('#output-'+key);if(out)out.textContent=value+'px';if(key==='appearance'&&state.view==='settings')render();if(key==='type'&&state.view==='guide')render();}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.agent){switchAgent(b.dataset.agent);return}if(b.dataset.appearance){setDesign('appearance',b.dataset.appearance);if(state.controls)renderControls();return}if(b.dataset.logo!==undefined){state.design.logo=Number(b.dataset.logo);render();if(state.controls)renderControls();return}if(b.dataset.pickerProvider){current().provider=b.dataset.pickerProvider;const label=$('.model-button .provider-name');if(label)label.textContent=current().provider;renderModelMenu();[...$('#model-menu').querySelectorAll('[data-picker-provider]')].find(n=>n.dataset.pickerProvider===current().provider)?.focus();return}if(b.dataset.pickerModel){current().model=b.dataset.pickerModel;const label=$('.model-button .model-name');if(label)label.textContent=current().model;closeModelMenu(true);return}const action=b.dataset.action;if(action==='chat')setView('chat');else if(action==='settings')setView('settings');else if(action==='agent-settings')setView('agent');else if(action==='new'){closeModelMenu();state.modal='new';renderModal()}else if(action==='close-modal'){state.modal=null;renderModal();$('#message-input')?.focus()}else if(action==='model-picker'){if(state.modelMenu)closeModelMenu(true);else openModelMenu()}else if(action==='toggle-sidebar')setVariant(state.design.variant==='c'?'a':'c');else if(action==='send')send();else if(action==='stop')stop();else if(action==='approval-sample')sampleApproval();else if(action==='approve')decide('approved');else if(action==='deny')decide('denied');else if(action==='close-controls')showControls(false);else if(action==='reset-design'){state.design={...designs,variant:state.design.variant};setVariant(state.design.variant);render();renderControls()}else if(action==='copy-draft'){try{await navigator.clipboard.writeText('A calmer start to every day.\n\nBring the day’s scattered tasks into one clear place, with room to move forward.\n\nStill to confirm: launch date and final pricing.');notify('Draft copied.')}catch{notify('Copy is unavailable here. You can select the draft text.')}}else if(action==='connection-preview')notify('Provider sign-in is outside this visual prototype. No credentials are collected.');else if(action==='defaults-preview')notify('New demo agents copy Codex and the example model.');else if(action==='sample-action')notify('This is a style specimen.');});
document.addEventListener('input',e=>{if(e.target.name==='name')e.target.setCustomValidity('');if(e.target.id==='message-input'){current().draft=e.target.value;const send=$('.send-button');if(send&&!current().response)send.disabled=!e.target.value.trim();e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,100)+'px';}if(e.target.dataset.design&&e.target.type==='range')setDesign(e.target.dataset.design,e.target.value);});
document.addEventListener('change',e=>{if(e.target.dataset.design)setDesign(e.target.dataset.design,e.target.value);});
document.addEventListener('submit',e=>{if(!['profile-form','new-agent-form'].includes(e.target.id))return;e.preventDefault();const form=new FormData(e.target),name=String(form.get('name')||'').trim();if(!name){e.target.querySelector('[name=name]').setCustomValidity('Enter a name.');e.target.reportValidity();return}if(e.target.id==='profile-form'){Object.assign(current(),{name,instructions:String(form.get('instructions')||''),provider:String(form.get('provider')),model:String(form.get('model'))});setView('chat');notify('Agent settings updated in this demo.');}else{const id='agent-'+state.nextId++;state.agents.push({id,name,detail:'Your new agent',instructions:String(form.get('instructions')||''),provider:'Codex',model:'Example model',draft:'',messages:[],approval:null,response:null});switchAgent(id);notify('Demo agent created.');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modelMenu){e.preventDefault();closeModelMenu(true);return}if(state.modal){state.modal=null;renderModal();$('#message-input')?.focus()}else if(state.controls)showControls(false);return}if(e.target.closest('.model-button')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openModelMenu(e.key==='ArrowDown'?'first':'last');return}if(state.modelMenu&&e.target.closest('#model-menu')){const items=[...$('#model-menu').querySelectorAll('[role=menuitemradio]')],i=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const target=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:items.length-1))%items.length;items[target].focus();return}if(e.key==='Tab')closeModelMenu(true);}if(e.key==='Tab'&&state.modal){const dialog=$('[role=dialog]'),els=[...dialog.querySelectorAll('button,input,textarea,select')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}return}if(e.target.id==='message-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!current().response)send();return}if(e.target.closest('input,textarea,select,[contenteditable=true]')||state.modal||state.controls)return;});
document.addEventListener('pointerdown',e=>{if(state.modelMenu&&!e.target.closest('.model-control'))closeModelMenu();});
$('#design-toggle').onclick=()=>showControls(!state.controls);$('#guide-toggle').onclick=()=>setView(state.view==='guide'?'chat':'guide');media.addEventListener('change',syncDesign);render();
</script>
</body>
</html>
