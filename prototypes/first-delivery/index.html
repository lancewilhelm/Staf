<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staf · first delivery prototype</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202726;background:#edf0eb;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #81a896;outline-offset:2px}.banner{background:#263a34;color:#e8f2ec;padding:9px 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px}.banner b{letter-spacing:.1em;text-transform:uppercase;font-size:10px}.banner span{color:#c7d7cc}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 170px);min-height:560px}.sidebar{background:#f7f8f5;border-right:1px solid #dce2db;padding:25px 16px;display:flex;flex-direction:column}.logo{font-size:22px;font-weight:750;letter-spacing:-.05em;margin:0 8px 34px}.logo i{display:inline-grid;place-items:center;width:27px;height:27px;background:#263f36;color:white;border-radius:9px;font-size:17px;font-style:normal;margin-right:8px}.sectionlabel{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#829087;font-weight:750;margin:0 10px 10px}.botbtn,.navbtn{border:0;background:transparent;text-align:left;width:100%;border-radius:10px;padding:10px;color:#44534a;display:flex;align-items:center;gap:10px}.botbtn.active,.navbtn.active{background:#e5ede6;color:#193b2d}.botbtn:hover,.navbtn:hover{background:#edf2eb}.avatar{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#cfdfd0;color:#2b543c;font-size:15px;font-weight:750}.avatar.large{width:46px;height:46px;border-radius:15px;font-size:19px}.botname{display:flex;flex:1;flex-direction:column;gap:2px;font-weight:650}.muted{font-weight:400;color:#859087;font-size:12px}.add{margin:10px 3px 27px;border:1px solid #d8e0d6;background:white;border-radius:9px;text-align:left;padding:10px;color:#466052}.sidebar-bottom{margin-top:auto;font-size:12px;color:#7a887f;padding:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#54a570;margin-right:6px}.dot.off{background:#c78248}.workspace{display:flex;flex-direction:column;min-width:0;background:#fff;position:relative}.top{height:73px;border-bottom:1px solid #e9ede8;padding:0 30px;display:flex;align-items:center;gap:13px}.top h1{font-size:16px;margin:0 0 3px;letter-spacing:-.02em}.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}.pill,.button{border:1px solid #d9e1da;background:white;color:#33473d;border-radius:9px;padding:9px 12px;font-weight:600}.pill:hover,.button:hover{background:#f3f7f2}.button.primary{background:#254c38;color:#fff;border-color:#254c38}.button.danger{color:#994c43;border-color:#ead2cd}.button:disabled{opacity:.45;cursor:not-allowed}.count{background:#e5f0e7;color:#477954;border-radius:20px;padding:2px 7px;font-size:11px}.body{display:flex;flex:1;min-height:0}.chat{flex:1;min-width:0;display:flex;flex-direction:column}.chat-scroll{overflow:auto;flex:1;padding:45px max(30px,calc((100% - 720px)/2)) 20px}.date{text-align:center;font-size:11px;color:#99a39c;margin:0 0 27px}.intro{max-width:560px;margin:22px auto 35px}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:750;text-transform:uppercase;color:#7c9183}.intro h2{font-size:27px;letter-spacing:-.04em;margin:9px 0}.intro p,.help{color:#738077;line-height:1.6}.message{display:flex;gap:12px;margin:25px 0;max-width:680px;line-height:1.55}.message.user{justify-content:flex-end}.bubble{max-width:85%;white-space:pre-wrap}.user .bubble{padding:12px 16px;border-radius:16px 16px 3px 16px;background:#eef3ec}.speaker{font-size:12px;font-weight:700;margin-bottom:6px}.notice{margin:20px 0 20px 48px;border:1px solid #dce9dc;background:#f6faf5;border-radius:12px;padding:13px 15px;color:#3b5b45;line-height:1.5}.notice button,.textbtn{border:0;background:none;color:#376b49;font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}.composer{padding:12px max(30px,calc((100% - 720px)/2)) 25px}.entry{border:1px solid #d9e0d8;border-radius:16px;padding:13px;box-shadow:0 4px 20px #263c2d0b;background:white}.entry textarea{border:0;resize:none;width:100%;outline:none;min-height:40px;background:transparent}.entryfoot{display:flex;justify-content:space-between;align-items:center;color:#929e95;font-size:11px}.entryfoot button{border:0;background:#315b40;color:white;border-radius:9px;padding:9px 14px}.entryfoot button:disabled{opacity:.4}.activity{min-width:0;overflow:auto;background:#fafbf9;border-left:1px solid #e4eae3}.activity.panel{position:absolute;right:0;top:73px;bottom:0;width:390px;z-index:3;box-shadow:-12px 0 35px #1e342218}.activity.full{flex:1;border-left:0;padding:22px 0}.activity.split{width:48%;min-width:420px}.activity-inner{padding:28px;max-width:900px;margin:auto}.activity h2{margin:4px 0 6px;font-size:21px;letter-spacing:-.03em}.activity h3{font-size:14px;margin:0}.activity-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:24px}.close{border:0;background:none;font-size:20px;color:#7a8c7d}.taskcard{background:white;border:1px solid #e0e7df;border-radius:14px;padding:16px;margin:10px 0;cursor:pointer}.taskcard:hover,.taskcard.selected{border-color:#9dbaa1}.tasktop{display:flex;justify-content:space-between;gap:10px;align-items:start}.status{font-size:10px;font-weight:700;border-radius:20px;padding:5px 8px;background:#e7f1e6;color:#397348;white-space:nowrap}.status.failed,.status.interrupted{background:#f7ede5;color:#9c633d}.status.stopping{background:#faf0db;color:#926b2a}.status.cancelled{background:#eff0ed;color:#70776f}.taskmeta{font-size:11px;color:#89958b;margin-top:7px}.events{list-style:none;margin:20px 0 0;padding:0}.events li{position:relative;border-left:1px solid #dce6db;margin-left:5px;padding:0 0 23px 19px;line-height:1.45;color:#405047}.events li:before{content:'';width:9px;height:9px;border:2px solid #aac8ad;background:#f8fbf7;border-radius:50%;position:absolute;left:-6px;top:3px}.events li small{display:block;color:#99a39a;margin-top:3px}.detail{margin-top:25px;padding-top:23px;border-top:1px solid #e4eae3}.detail p{line-height:1.5;color:#69796c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.full-grid{display:grid;grid-template-columns:minmax(240px, .8fr) minmax(300px,1.4fr);gap:40px}.full-grid .detail{margin:0;padding:0 0 0 36px;border-top:0;border-left:1px solid #e4eae3}.variantbar{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:#1b2b23;color:#fff;box-shadow:0 8px 30px #14221a55;border-radius:30px;padding:4px;display:flex;align-items:center;gap:3px;z-index:10;font-size:11px}.variantbar button{background:none;border:0;color:white;padding:6px 13px;border-radius:20px}.variantbar button.active{background:#e7f1e7;color:#1d3826;font-weight:700}.prototype-space{height:87px;background:#f8faf7}.toolbar{background:#f2f4ed;border-top:1px solid #dce4d9;padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:#738076}.toolbar button{background:white;border:1px solid #dbe2d8;border-radius:7px;color:#56675b;padding:6px 8px}.toolbar button:hover{border-color:#92ac96}.toolbar strong{margin-right:6px;color:#52675a}.offline{background:#fff5e7;color:#8a6036;padding:10px 25px;font-size:12px}.modal-bg{position:fixed;inset:0;background:#17241cb0;display:grid;place-items:center;z-index:20}.modal{background:#fff;border-radius:18px;padding:26px;width:min(450px,90vw);box-shadow:0 20px 80px #0004}.modal h2{margin:0 0 8px;font-size:22px}.modal label{display:block;font-size:12px;font-weight:700;margin:20px 0 6px}.modal input,.modal textarea{border:1px solid #d8e0d7;border-radius:9px;width:100%;padding:10px;resize:vertical}.modal .actions{justify-content:flex-end}.terminal{background:#1f2924;color:#d8e7da;flex:1;padding:28px 34px;overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}.terminal h2{font:700 18px Inter,-apple-system,sans-serif;color:white;margin:0 0 10px}.terminal pre{white-space:pre-wrap;color:#cad8cb}.terminal .cmd{color:#9ecfa6}.terminal .terminal-buttons{display:flex;gap:8px;flex-wrap:wrap}.terminal button{background:#31493a;color:#e7f2e8;border:1px solid #57715b;padding:8px 12px;border-radius:7px}.hint{font-size:11px;color:#93a59a;margin-top:25px}.hidden{display:none!important}@media(max-width:850px){.shell{grid-template-columns:70px 1fr}.sidebar{padding:20px 8px}.logo{margin-left:4px}.logo span,.sectionlabel,.botname,.add span,.sidebar-bottom,.navbtn span{display:none}.add{font-size:0;text-align:center}.add:after{content:'+';font-size:20px}.activity.panel,.activity.split{position:absolute;right:0;top:73px;bottom:0;width:min(100%,430px);min-width:0;box-shadow:-10px 0 30px #0002;z-index:3}.activity.full{position:absolute;inset:73px 0 0 0;z-index:3}.full-grid{display:block}.full-grid .detail{border-left:0;border-top:1px solid #e4eae3;padding:20px 0 0;margin-top:20px}.chat-scroll{padding:25px}.composer{padding:12px 20px 25px}.top{padding:0 16px}.toolbar{max-height:100px;overflow:auto}.variantbar{bottom:100px;max-width:98vw;overflow:auto;white-space:nowrap}}
</style>
</head>
<body>
<div class="banner"><div><b>Prototype</b> <span> · Synthetic data only. Nothing connects to Staf or a model.</span></div><span id="connection"></span></div>
<div id="app"></div>
<div class="variantbar" role="group" aria-label="Layout comparison"><button id="prev" aria-label="Previous layout">←</button><span>Layouts</span><button data-variant="a">A · Side by side</button><button data-variant="b">B · Separate Activity</button><button data-variant="c">C · Activity drawer</button><button id="next" aria-label="Next layout">→</button></div>
<script>
// Three layouts compare chat and Activity using the same simulated bot and task data.
const initial = () => ({bots:[{id:'bot-1',name:'Avery',instructions:'Help me stay organized and keep me informed.',messages:[{type:'bot',text:'Hi Lance. I’m here when you need a hand.'},{type:'user',text:'What can you help me with?'},{type:'bot',text:'We can chat here. For longer work, I can start a task and keep you updated while you carry on.'}],tasks:[]}],botId:'bot-1',connected:true,view:'chat',selectedTask:null,modal:false,cli:'list',nextId:1});
let state=initial();
let variant=new URLSearchParams(location.search).get('variant');if(!['a','b','c'].includes(variant))variant='a';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bot=()=>state.bots.find(x=>x.id===state.botId);const active=t=>['running','stopping'].includes(t.status);const selected=()=>bot().tasks.find(t=>t.id===state.selectedTask)||bot().tasks[0];
const label={running:'Running',stopping:'Stopping',cancelled:'Stopped',completed:'Completed',failed:'Failed',interrupted:'Interrupted'};
function announce(text,task){bot().messages.push({type:'notice',text,task});}
function startTask(previous){const b=bot();const busy=b.tasks.find(active);if(busy){announce(`Already working on ${busy.id}. Open Activity to see its progress.`,busy.id);render();return}const n=state.nextId++;const t={id:`T-${String(n).padStart(3,'0')}`,objective:'Check the current time',status:'running',events:[{text:'Task started',time:'Just now'},{text:'Preparing a read-only clock request',time:'Just now'}],previous:previous||null};b.tasks.unshift(t);state.selectedTask=t.id;announce(`Started ${t.id}: ${t.objective}. You can keep chatting while I work.`,t.id);render()}
function finish(kind){const t=selected();if(!t||!active(t))return;if(kind==='stop'){if(t.status!=='running')return;t.status='stopping';t.events.push({text:'Stop requested. Waiting for the current step to finish.',time:'Just now'});announce(`Stop requested for ${t.id}. I’ll let you know when it has stopped.`,t.id)}else if(kind==='settle'){if(t.status!=='stopping')return;t.status='cancelled';t.events.push({text:'Task stopped after the current step settled.',time:'Just now'});announce(`${t.id} has stopped.`,t.id)}else if(kind==='complete'){t.status='completed';t.events.push({text:'Clock returned 10:24 AM (example result).',time:'Just now'},{text:'Result recorded.',time:'Just now'});announce(`${t.id} completed. The example time is 10:24 AM.`,t.id)}else if(kind==='fail'){t.status='failed';t.events.push({text:'Clock request failed. No result was returned.',time:'Just now'});announce(`${t.id} failed. Its recorded steps are in Activity.`,t.id)}render()}
function retry(){const t=selected();if(t&&!active(t))startTask(t.id)}
function restart(){let changed=false;for(const b of state.bots){for(const t of b.tasks){if(active(t)){t.status='interrupted';t.events.push({text:'Instance restarted before this attempt finished.',time:'Just now'});b.messages.push({type:'notice',text:`${t.id} was interrupted when the instance restarted. You can choose to retry it.`,task:t.id});changed=true}}}state.connected=true;if(!changed)alert('The simulated instance restarted. There was no running task to interrupt.');render()}
function setVariant(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function openActivity(id){if(id)state.selectedTask=id;state.view='activity';render()}
function taskCard(t){return `<div class="taskcard ${selected()?.id===t.id?'selected':''}" role="button" tabindex="0" data-task="${esc(t.id)}"><div class="tasktop"><h3>${esc(t.objective)}</h3><span class="status ${t.status}">${label[t.status]}</span></div><div class="taskmeta">${esc(t.id)} · ${t.previous?'Retry of '+esc(t.previous)+' · ':''}Just now</div></div>`}
function detail(t){if(!t)return `<div class="detail"><h3>No tasks yet</h3><p>Start an example task to see its steps here.</p><button class="button primary" data-action="start" ${!state.connected?'disabled':''}>Start example task</button></div>`;return `<div class="detail"><div class="eyebrow">Task details · ${esc(t.id)}</div><h2>${esc(t.objective)}</h2><p><span class="status ${t.status}">${label[t.status]}</span> ${t.previous?`&nbsp; Retry of ${esc(t.previous)}`:''}</p><ul class="events">${t.events.map(e=>`<li>${esc(e.text)}<small>${esc(e.time)}</small></li>`).join('')}</ul><div class="actions">${t.status==='running'?`<button class="button danger" data-action="stop" ${!state.connected?'disabled':''}>Stop task</button>`:''}${!active(t)?`<button class="button" data-action="retry" ${!state.connected?'disabled':''}>Retry task</button>`:''}</div>${t.status==='stopping'?'<p>Stop requested. Waiting for the current step to settle.</p>':''}</div>`}
function activity(){let t=selected();const cards=bot().tasks.map(taskCard).join('')||'<p class="help">Tasks you start will appear here.</p>';return `<section class="activity ${variant==='a'?'split':variant==='b'?'full':'panel'}" aria-label="Activity"><div class="activity-inner"><div class="activity-head"><div><div class="eyebrow">${esc(bot().name)}’s work</div><h2>Activity</h2><div class="muted">Actual task steps and outcomes</div></div><button class="close" data-action="chat" aria-label="Close Activity">×</button></div>${variant==='b'?`<div class="full-grid"><div><div class="sectionlabel">Tasks</div>${cards}</div>${detail(t)}</div>`:`<div class="sectionlabel">Tasks</div>${cards}${detail(t)}`}</div></section>`}
function chat(){const b=bot();return `<section class="chat"><div class="chat-scroll"><div class="date">TODAY</div><div class="intro"><div class="eyebrow">Your main chat</div><h2>Good to see you.</h2><p>Talk with ${esc(b.name)} here. When work moves into the background, you can keep the conversation going.</p></div>${b.messages.map(m=>m.type==='notice'?`<div class="notice">${esc(m.text)} ${m.task?`<button data-open-task="${esc(m.task)}">View Activity ↗</button>`:''}</div>`:`<div class="message ${m.type}">${m.type==='bot'?`<span class="avatar">${esc(b.name[0].toUpperCase())}</span>`:''}<div class="bubble">${m.type==='bot'?`<div class="speaker">${esc(b.name)}</div>`:''}${esc(m.text)}</div></div>`).join('')}</div><div class="composer"><div class="entry"><textarea id="message" placeholder="Message ${esc(b.name)}..." aria-label="Message ${esc(b.name)}" ${!state.connected?'disabled':''}></textarea><div class="entryfoot"><span>${state.connected?'Main chat remains available during tasks':'Reconnect to send a message'}</span><button data-action="send" ${!state.connected?'disabled':''}>Send ↑</button></div></div></div></section>`}
function cli(){const t=selected();let body=state.cli==='list'?`$ staf tasks\n${bot().tasks.length?bot().tasks.map(x=>`${x.id}   ${label[x.status].padEnd(11)} ${x.objective}`).join('\n'):'No tasks yet.'}`:state.cli==='detail'?`$ staf task ${t?.id||'T-001'}\n${t?`${t.objective}\nStatus: ${label[t.status]}\n\n${t.events.map(e=>'  • '+e.text).join('\n')}`:'No task selected.'}`:`$ staf task ${t?.id||'T-001'} --follow\n${t?t.events.map(e=>'  • '+e.text).join('\n'):'No task selected.'}\n\nFollowing. Leave this view to return to chat; the task continues.`;return `<section class="terminal"><h2>CLI preview</h2><p>Illustrative commands and the same synthetic task. Commands are not implemented.</p><div class="terminal-buttons"><button data-cli="list">List tasks</button><button data-cli="detail">Inspect task</button><button data-cli="follow">Follow progress</button><button data-action="chat">Return to chat</button></div><pre>${esc(body)}</pre><div class="hint">Switch layouts or use the simulation controls below to change the example state.</div></section>`}
function modal(){return `<div class="modal-bg"><form class="modal" id="bot-form"><div class="eyebrow">New bot</div><h2>Create your bot</h2><p class="help">Start with a name and instructions. You can customize the rest later.</p><label for="new-name">Name</label><input id="new-name" required maxlength="40" placeholder="e.g. Avery"><label for="new-instructions">Instructions</label><textarea id="new-instructions" required rows="3" placeholder="What should this bot help you with?"></textarea><p class="muted">This example copies initial settings at creation. No model or credentials are required here.</p><div class="actions"><button type="button" class="button" data-action="cancel-modal">Cancel</button><button class="button primary">Create bot</button></div></form></div>`}
function render(){const b=bot();const n=b.tasks.filter(active).length;$('#connection').innerHTML=`<span class="dot ${state.connected?'':'off'}"></span>${state.connected?'Example instance connected':'Client disconnected'}`;$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo"><i>s</i><span>staf</span></div><div class="sectionlabel">Your bots</div>${state.bots.map(x=>`<button class="botbtn ${x.id===b.id?'active':''}" data-bot="${esc(x.id)}"><span class="avatar">${esc(x.name[0].toUpperCase())}</span><span class="botname">${esc(x.name)}<small class="muted">Main chat</small></span></button>`).join('')}<button class="add" data-action="new-bot" ${!state.connected?'disabled':''}>＋ <span>New bot</span></button><div class="sectionlabel">Explore</div><button class="navbtn ${state.view==='chat'?'active':''}" data-action="chat">◌ <span>Chat</span></button><button class="navbtn ${state.view==='activity'?'active':''}" data-action="activity">◷ <span>Activity ${n?`<span class="count">${n}</span>`:''}</span></button><button class="navbtn ${state.view==='cli'?'active':''}" data-action="cli">⌘ <span>CLI preview</span></button><div class="sidebar-bottom"><span class="dot"></span> Personal instance<br><br>Example workspace</div></aside><main class="workspace"><header class="top"><button class="avatar large" data-action="activity" title="Open Activity" aria-label="Open ${esc(b.name)} Activity">${esc(b.name[0].toUpperCase())}</button><div><h1>${esc(b.name)}</h1><div class="muted">${state.view==='activity'?'Activity':'Your assistant'} ${n?' · '+n+' task running':''}</div></div><div class="right"><button class="pill" data-action="activity">◷ &nbsp; Activity ${n?`<span class="count">${n}</span>`:''}</button></div></header>${!state.connected?'<div class="offline">This client is disconnected. Existing work continues on the example instance. Reconnect to send commands.</div>':''}<div class="body">${state.view==='cli'?cli():state.view==='activity'&&variant==='b'?activity():chat()+(state.view==='activity'?activity():'')}</div></main></div><div class="prototype-space"></div><div class="toolbar"><strong>SIMULATE</strong><button data-action="start" ${!state.connected?'disabled':''}>Start task</button><button data-action="complete">Complete</button><button data-action="fail">Fail</button><button data-action="stop" ${!state.connected?'disabled':''}>Request stop</button><button data-action="settle">Confirm stopped</button><button data-action="disconnect">${state.connected?'Disconnect client':'Reconnect client'}</button><button data-action="restart">Restart instance</button><button data-action="reset">Reset example</button></div>${state.modal?modal():''}`;document.querySelectorAll('[data-variant]').forEach(x=>x.classList.toggle('active',x.dataset.variant===variant));}
document.addEventListener('click',e=>{const v=e.target.closest('[data-variant]');if(v){setVariant(v.dataset.variant);return}const task=e.target.closest('[data-task]');if(task){state.selectedTask=task.dataset.task;render();return}const open=e.target.closest('[data-open-task]');if(open){openActivity(open.dataset.openTask);return}const bb=e.target.closest('[data-bot]');if(bb){state.botId=bb.dataset.bot;state.selectedTask=null;state.view='chat';render();return}const cc=e.target.closest('[data-cli]');if(cc){state.cli=cc.dataset.cli;render();return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='activity')openActivity();else if(a==='chat'||a==='cli'){state.view=a;render()}else if(a==='new-bot'){state.modal=true;render();$('#new-name')?.focus()}else if(a==='cancel-modal'){state.modal=false;render()}else if(a==='send'){const input=$('#message');const text=input?.value.trim();if(text&&state.connected){bot().messages.push({type:'user',text},{type:'bot',text:'I’ve got your message. This is a simulated reply while the example task continues.'});render()}}else if(a==='start'&&state.connected)startTask();else if(a==='retry'&&state.connected)retry();else if(['stop','settle','complete','fail'].includes(a))finish(a);else if(a==='disconnect'){state.connected=!state.connected;render()}else if(a==='restart')restart();else if(a==='reset'){state=initial();render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='bot-form')return;e.preventDefault();const name=$('#new-name').value.trim(),instructions=$('#new-instructions').value.trim();if(!name||!instructions)return;const id='bot-'+(state.bots.length+1);state.bots.push({id,name,instructions,messages:[{type:'bot',text:`Hi, I’m ${name}. What would you like to work on?`}],tasks:[]});state.botId=id;state.selectedTask=null;state.modal=false;state.view='chat';render()});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const all=['a','b','c'],i=all.indexOf(variant);setVariant(all[(i+(e.key==='ArrowLeft'?2:1))%3])}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.task){e.preventDefault();state.selectedTask=e.target.dataset.task;render()}});$('#prev').onclick=()=>setVariant(['c','a','b'][['a','b','c'].indexOf(variant)]);$('#next').onclick=()=>setVariant(['b','c','a'][['a','b','c'].indexOf(variant)]);render();
</script>
</body>
</html>
